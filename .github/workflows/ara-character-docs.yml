| `Sit (passenger)` | Loop | Altura do assento | Passageiro |
| `Ride bicycle` | Loop | ~0.93 m | Pedalar bicicleta |
| `Ride motorcycle` | Loop | ~0.78 m | Conduzir mota |
| `Ride horse (trot)` | Loop | ~1.40 m | Trote a cavalo |
| `Paddle canoe` | Loop | Altura do assento | Remar canoa |
| `Paddle kayak` | Loop | Altura do assento | Remar kayak |
| `Row boat` | Loop | Altura do assento | Remar barco (remos) |
| `Drive boat (helm)` | Loop | Altura do assento | Conduzir barco (leme) |

