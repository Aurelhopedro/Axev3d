### 10. Vehicles

> Animam apenas o rider. O veículo é fornecido pelo jogo e o personagem é parentado ao assento.  
> As mãos são posicionadas por IK nos controlos (volante às 9h e 3h, guiador, rédeas, remo, etc.).

