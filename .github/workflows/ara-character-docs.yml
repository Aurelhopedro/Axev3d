name: Ara 3D - Generate Character Docs

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset do personagem (ex.: The Soldier)'
        required: false
        type: string
        default: 'The Soldier'
      output_branch:
        description: 'Branch onde os docs serao guardados'
        required: false
        type: string
        default: 'docs/character'

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create docs output directory
        run: mkdir -p docs-out

      - name: Generate docs
        env:
          PRESET: ${{ inputs.preset }}
          OUT_DIR: docs-out
        run: python3 scripts/generate_docs.py

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ inputs.output_branch }}"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout "$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf . 2>/dev/null || true
          fi
          mkdir -p docs
          cp docs-out/ANIMATIONS.md docs/ANIMATIONS.md
          cp docs-out/CUSTOMIZATION.md docs/CUSTOMIZATION.md
          git add docs/ANIMATIONS.md docs/CUSTOMIZATION.md
          git diff --cached --quiet && echo "Sem alteracoes." || git commit -m "docs: preset=${{ inputs.preset }} run=${{ github.run_number }}"
          git push origin "$BRANCH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: character-docs-${{ github.run_number }}
          path: docs-out/
          retention-days: 30
