name: Ara 3D — Generate Character Docs

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset do personagem (ex.: The Soldier). Deixe vazio para usar o padrão.'
        required: false
        type: string
        default: 'The Soldier'
      output_branch:
        description: 'Branch onde os docs serão guardados'
        required: false
        type: string
        default: 'docs/character'

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone Ara 3D Gen
        run: |
          git clone --depth 1 https://github.com/olatunde85/3d-gen.git ara-3d-gen

      - name: Create docs output directory
        run: mkdir -p docs-out

      - name: Generate ANIMATIONS.md
        run: |
          cat > docs-out/ANIMATIONS.md << 'MDEOF'
# Ara 3D Gen — Catálogo de Animações

> Personagem gerado com o preset **${{ inputs.preset }}**  
> Ferramenta: [Ara 3D Gen](https://github.com/olatunde85/3d-gen) | Exportado via workflow GitHub Actions

---

## Visão Geral

O personagem Ara 3D Gen vem com **48 animações** distribuídas em 8 categorias.  
Todas as animações são avaliadas pelo mesmo motor (`src/core/anim/evaluate.ts`),
garantindo que o que se vê no preview é exatamente o que se exporta.

- **Formato GLB:** uma animação `glTF animation` por clip (30 fps, canais de rotação + translação root)
- **Formato FBX:** um `AnimationStack` (take) por clip
- **Root motion:** disponível para Walk, Run e Strafe — faz o personagem deslocar-se em vez de animar no lugar

---

## Tabela Completa de Animações

### 1. Idle & Stance

| Nome do Clip | Tipo | Descrição |
|---|---|---|
| `Idle` | Loop | Idle relaxado com braços soltos — pose padrão ao carregar o personagem |
| `Crouch idle` | Loop | Idle em posição de agachamento |

---

### 2. Locomotion

> Todos os clips de locomoção são loops. Podem ser exportados **in place** ou com **root motion** (o personagem desloca-se fisicamente).

| Nome do Clip | Tipo | Descrição |
|---|---|---|
| `Walk` | Loop | Caminhada upright, capturada com motion capture (CMU 07_01) |
| `Slouch walk` | Loop | Caminhada com tronco inclinado ~13° (CMU 02_01, versão alternativa) |
| `Run` | Loop | Corrida com motion capture |
| `Walk backwards` | Loop | Recuo a pé |
| `Strafe left` | Loop | Deslocamento lateral para a esquerda |
| `Strafe right` | Loop | Deslocamento lateral para a direita |

---

